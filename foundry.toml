[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/", "forge-std/=lib/forge-std/src/"]

[fuzz]
runs = 512

[rpc_endpoints]
bsc_testnet = "https://bsc-testnet-rpc.publicnode.com"

[lint]
lint_on_build = false
